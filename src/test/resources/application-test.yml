newsdata:
  apiKey: test-newsdata-key
  url: https://test-newsdata-url.com
  timeframe: 1h
  interval-ms: 10000

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    mongodb:
      uri: mongodb://localhost:27017/test

gemini:
  apiKey: test-gemini-key
  url: https://test-gemini-url.com
  maxOutputTokens: 100
