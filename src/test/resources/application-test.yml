# src/test/resources/application-test.yml

newsdata:
  apiKey: test-key
  url: https://newsdata.io/api/1
  timeframe: 1h
  interval-ms: 10000

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

gemini:
  apiKey: test-gemini-key
  url: https://test-url
  maxOutputTokens: 100
