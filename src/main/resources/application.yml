logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.security.web.FilterChainProxy: INFO
    sizz.api: INFO

server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework

newsdata:
  apiKey: ${NEWSDATA_API_KEY}
  url: https://newsdata.io/api/1

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sizz?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: sizzuser
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    debug: false
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  data:
    mongodb:
      host: 127.0.0.1
      port: 27017
      database: sizz
      username: sizzuser
      password: ${MONGODB_PASSWORD}
      authentication-database: sizz
      auto-index-creation: true

    redis:
      host: 127.0.0.1
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}

gemini:
  apiKey: ${GEMINI_API_KEY}
  url: https://generativelanguage.googleapis.com
  model: gemini-2.5-flash
  maxOutputTokens:
    summaryAndInclination: 2000
    insightKeywords: 1536

schedule:
  viewSyncMs: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  ratelimiter:
    instances:
      geminiApi:
        limit-for-period: 6
        limit-refresh-period: 60s
        timeout-duration: 60s

app:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}