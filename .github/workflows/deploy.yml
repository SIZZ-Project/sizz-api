name: Deploy to GCP

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Rename jar to match systemd target
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          if [ "$JAR" != "build/libs/sizz-api-0.0.1-SNAPSHOT.jar" ]; then
            cp "$JAR" build/libs/sizz-api-0.0.1-SNAPSHOT.jar
          fi

      - name: Create target directory on GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.GCP_USER }}/build/libs

      - name: Copy executable jar to GCP instance via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: build/libs/sizz-api-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.GCP_USER }}/build/libs
          strip_components: 2

      - name: Write env file on GCP (systemd EnvironmentFile)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo mkdir -p /etc/sizz
            sudo sh -c "printf '%s\n' 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' > /etc/sizz/sizz-api.env"
            sudo chmod 600 /etc/sizz/sizz-api.env

      - name: Restart Spring Boot service on GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            echo "[1] Reload systemd daemon"
            sudo systemctl daemon-reload

            echo "[2] Restart Spring Boot application"
            sudo systemctl restart sizz-api

            echo "[3] Show service status"
            sudo systemctl status sizz-api --no-pager
