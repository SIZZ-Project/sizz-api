name: Deploy to AWS via SSM (no-SSH)

on:
  push:
    branches: [ staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION:  ${{ secrets.AWS_REGION }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      S3_BUCKET:   ${{ vars.S3_BUCKET }}
      S3_KEY:      ${{ vars.S3_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      # 산출물 이름을 고정
      - name: Normalize jar name
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n 1)
          if [ "$JAR" != "build/libs/sizz-api-0.0.1-SNAPSHOT.jar" ]; then
            cp "$JAR" build/libs/sizz-api-0.0.1-SNAPSHOT.jar
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload jar to S3 (private)
        run: |
          aws s3 cp build/libs/sizz-api-0.0.1-SNAPSHOT.jar "s3://$S3_BUCKET/$S3_KEY"

      # === 핵심: SSM으로 원격 배포 ===
      # - 비밀은 Parameter Store(SecureString)에서 읽어 /etc/sizz/sizz-api.env 파일로 저장
      # - S3 버킷/키는 원격 셸에 export 해서 사용
      - name: Deploy via SSM (write env + download jar + restart)
        id: ssm
        run: |
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "sudo mkdir -p /etc/sizz /opt/sizz/build/libs",

              "which aws || (sudo apt-get update && sudo apt-get install -y awscli jq)",

              "echo '>> write /etc/sizz/sizz-api.env from Parameter Store'",
              "sudo bash -c 'cat > /etc/sizz/sizz-api.env <<\"EOF\"\nGEMINI_API_KEY=$(aws ssm get-parameter --name \"/sizz/GEMINI_API_KEY\" --with-decryption --query \"Parameter.Value\" --output text)\nGOOGLE_CLIENT_ID=$(aws ssm get-parameter --name \"/sizz/GOOGLE_CLIENT_ID\" --with-decryption --query \"Parameter.Value\" --output text)\nGOOGLE_CLIENT_SECRET=$(aws ssm get-parameter --name \"/sizz/GOOGLE_CLIENT_SECRET\" --with-decryption --query \"Parameter.Value\" --output text)\nEOF'",
              "sudo chmod 600 /etc/sizz/sizz-api.env",

              "echo '>> export S3 variables'",
              "export S3_BUCKET=${{ vars.S3_BUCKET }}",
              "export S3_KEY=${{ vars.S3_KEY }}",
              "echo Using s3://$S3_BUCKET/$S3_KEY",

              "echo '>> download artifact from S3'",
              "aws s3 cp s3://$S3_BUCKET/$S3_KEY /tmp/sizz-api.jar",

              "sudo mv /tmp/sizz-api.jar /opt/sizz/build/libs/sizz-api-0.0.1-SNAPSHOT.jar",

              "echo '>> restart service'",
              "sudo systemctl daemon-reload",
              "sudo systemctl restart sizz-api",

              "echo '>> status'",
              "sudo systemctl status sizz-api --no-pager || true"
            ],
            "executionTimeout": ["3600"]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy sizz-api" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)

          echo "command_id=$CMD_ID"
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait until SSM command finishes (with error output)
        run: |
          CID="${{ steps.ssm.outputs.command_id }}"
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations --command-id "$CID" --details \
              --query 'CommandInvocations[0].Status' --output text || true)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "----- SSM StdOut / StdErr -----"
              aws ssm list-command-invocations --command-id "$CID" --details \
                --query 'CommandInvocations[0].CommandPlugins[0].[StandardOutputContent,StandardErrorContent]' \
                --output text || true
              exit 1
            fi
            sleep 5
          done
          echo "Timeout waiting SSM command"; exit 1

      # 서비스 로그 확인
      - name: Tail service logs
        if: always()
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["sudo journalctl -u sizz-api -n 120 --no-pager"]' \
            --query 'Command.CommandId' --output text
