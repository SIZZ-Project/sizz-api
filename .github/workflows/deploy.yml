name: Deploy to GCP

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create target directory on GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.GCP_USER }}/build/libs

      - name: Copy executable jar to GCP instance via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: build/libs/*SNAPSHOT.jar
          target: /home/${{ secrets.GCP_USER }}/build/libs

      - name: SSH to GCP and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            echo "[1] Kill existing java process if any"
            pkill -f 'java -jar' || true

            echo "[2] Change to build/libs directory"
            cd /home/${{ secrets.GCP_USER }}/build/libs

            echo "[3] Select the executable jar (exclude -plain.jar)"
            JAR_FILE=$(ls -t *SNAPSHOT.jar | grep -v 'plain' | head -n1)

            echo "[4] Run in tmux session"
            tmux new-session -d "java -jar $JAR_FILE > ~/app.log 2> ~/app.err"

            echo "[5] Deployment complete. App is running in tmux session."
